name: Build index.json

# No path filter. This job validates themes, the README key table and the
# contract-driven required-colour list, so the set of files it guards is
# effectively the whole repo - and the filter it replaced listed only
# themes/** and build-index.mjs. A PR from sync-contract.mjs touches
# theme-contract.json and README.md and nothing else, which is precisely the
# PR the staleness check exists for, and it triggered no CI at all. The
# staleness then survived until some unrelated theme submission arrived and
# that contributor's PR went red for a change they did not make. A filter
# that fails by running nothing is not worth a few seconds of Node.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate themes
    runs-on: ubuntu-latest
    # Needed for the auto-commit step on push to main. Safe under default
    # GITHUB_TOKEN; no PAT required.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        run: node scripts/build-index.test.mjs
      - name: README key table is up to date
        run: |
          node scripts/gen-readme-table.mjs
          if ! git diff --quiet README.md; then
            echo "README key table is stale. Run: node scripts/gen-readme-table.mjs"
            git diff README.md
            exit 1
          fi
      - name: Build index (dry run)
        run: |
          node scripts/build-index.mjs
          # On PRs, don't commit; just ensure it runs without error.
      - name: Commit index.json (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet index.json; then
            echo "index.json is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: regenerate index.json"
            git push
          fi
